<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Inventario de casa</title>
  <meta name="theme-color" content="#2f7d5b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Inventario">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon-192.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <style>
    :root {
      --bg: #f6f3ec; --card: #ffffff; --ink: #23201b; --muted: #776f63; --line: #e7e1d5;
      --accent: #2f7d5b; --accent-ink: #ffffff; --accent-soft: #e2efe8;
      --warn: #b86e12; --warn-soft: #fbecd6; --bad: #b3372b; --bad-soft: #f8dfdb;
      --mid: #b08a00; --mid-dot: #e3b505; --mid-soft: #fbf2c9;
      --low: #5b5bb0; --low-soft: #e6e6f6; --shadow: 0 1px 2px rgba(40,30,10,.06), 0 4px 14px rgba(40,30,10,.06);
      --r: 14px; --tab-h: 64px;
      color-scheme: light;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #171614; --card: #22201d; --ink: #f1ece3; --muted: #a59d90; --line: #35322d;
        --accent: #5cb58b; --accent-ink: #10231a; --accent-soft: #1f3a2d;
        --warn: #f0a650; --warn-soft: #3b2c18; --bad: #f07d6e; --bad-soft: #3e211d;
        --mid: #f2d052; --mid-dot: #f2d052; --mid-soft: #39321a;
        --low: #a3a3f0; --low-soft: #2a2a45; --shadow: 0 1px 2px rgba(0,0,0,.3);
        color-scheme: dark;
      }
    }
    :root[data-theme="dark"] {
        --bg: #171614; --card: #22201d; --ink: #f1ece3; --muted: #a59d90; --line: #35322d;
        --accent: #5cb58b; --accent-ink: #10231a; --accent-soft: #1f3a2d;
        --warn: #f0a650; --warn-soft: #3b2c18; --bad: #f07d6e; --bad-soft: #3e211d;
        --mid: #f2d052; --mid-dot: #f2d052; --mid-soft: #39321a;
        --low: #a3a3f0; --low-soft: #2a2a45; --shadow: 0 1px 2px rgba(0,0,0,.3);
        color-scheme: dark;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; background: var(--bg); color: var(--ink); }
    body {
      font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      min-height: 100dvh; overscroll-behavior-y: none;
      padding-bottom: calc(var(--tab-h) + env(safe-area-inset-bottom));
    }
    button, input, select, textarea { font: inherit; color: inherit; }
    button { cursor: pointer; }
    [hidden] { display: none !important; }

    /* Cabecera */
    .top {
      position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 8px;
      padding: calc(10px + env(safe-area-inset-top)) 16px 10px; background: var(--bg);
      border-bottom: 1px solid var(--line);
    }
    .top h1 { font-size: 22px; margin: 0; flex: 1; letter-spacing: -.01em; }
    .pill {
      display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--card);
      border-radius: 999px; padding: 6px 12px; font-size: 13px; color: var(--muted); white-space: nowrap;
    }
    .pill::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
    .pill.ok::before { background: var(--accent); }
    .pill.warn { color: var(--warn); } .pill.warn::before { background: var(--warn); }
    .pill.bad { color: var(--bad); } .pill.bad::before { background: var(--bad); }
    .pill.busy::before { background: var(--accent); animation: blink 1s infinite; }
    @keyframes blink { 50% { opacity: .2; } }
    .icon-btn { border: 0; background: transparent; width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; color: var(--ink); }
    .icon-btn:active { background: var(--line); }
    .icon-btn.light { color: #fff; }
    .ic { display: inline-grid; place-items: center; width: 22px; height: 22px; }
    .ic svg { width: 100%; height: 100%; }

    main { padding: 12px 16px 96px; max-width: 640px; margin: 0 auto; }

    /* Barra inferior */
    .tabbar {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; display: grid; grid-auto-flow: column; grid-auto-columns: 1fr;
      justify-items: center; align-items: center; height: calc(var(--tab-h) + env(safe-area-inset-bottom)); padding: 0 8px env(safe-area-inset-bottom);
      background: var(--card); border-top: 1px solid var(--line);
    }
    .tab { border: 0; background: none; display: grid; justify-items: center; gap: 2px; font-size: 12px; color: var(--muted); padding: 6px 0; position: relative; }
    .tab.on { color: var(--accent); font-weight: 600; }
    .tab .count { position: absolute; top: 0; left: calc(50% + 6px); background: var(--bad); color: #fff; font-size: 11px; border-radius: 9px; padding: 0 5px; min-width: 18px; line-height: 18px; }
    .scan-btn {
      width: 64px; height: 64px; border-radius: 50%; border: 0; background: var(--accent); color: var(--accent-ink);
      display: grid; place-items: center; margin-top: -26px; box-shadow: 0 6px 18px rgba(47,125,91,.35);
    }
    .scan-btn .ic { width: 30px; height: 30px; }
    .fab {
      position: fixed; right: 16px; bottom: calc(var(--tab-h) + 16px + env(safe-area-inset-bottom)); z-index: 25;
      height: 48px; padding: 0 18px 0 14px; border-radius: 24px; border: 0; background: var(--ink); color: var(--bg);
      display: flex; align-items: center; gap: 6px; font-weight: 600; box-shadow: var(--shadow);
    }

    /* Buscador y filtros */
    .search { display: flex; align-items: center; gap: 8px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 0 12px; }
    .search input { border: 0; outline: 0; background: none; flex: 1; height: 44px; min-width: 0; }
    .chips { display: flex; gap: 8px; overflow-x: auto; padding: 10px 0 4px; scrollbar-width: none; margin: 0 -16px; padding-left: 16px; padding-right: 16px; }
    .chips::-webkit-scrollbar { display: none; }
    .chip { flex: none; border: 1px solid var(--line); background: var(--card); border-radius: 999px; padding: 7px 13px; font-size: 14px; white-space: nowrap; }
    .chip.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
    .chip small { opacity: .7; margin-left: 4px; }
    select.chip { appearance: none; padding-right: 26px; background-image: linear-gradient(45deg, transparent 50%, currentColor 50%), linear-gradient(135deg, currentColor 50%, transparent 50%); background-position: calc(100% - 14px) 50%, calc(100% - 9px) 50%; background-size: 5px 5px; background-repeat: no-repeat; }

    /* Filas */
    .list { display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px; margin-top: 8px; }
    .row { min-width: 0; }
    .row {
      display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; background: var(--card); border: 1px solid var(--line);
      border-radius: var(--r); padding: 10px 12px; box-shadow: var(--shadow); min-height: 64px;
    }
    .row:active { transform: scale(.995); }
    .plain { border: 0; background: none; padding: 0; text-align: left; }
    .row-main { flex: 1; min-width: 0; }
    .row-title { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .row-sub { color: var(--muted); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .row-qty { text-align: right; line-height: 1.1; }
    .row-qty b { font-size: 20px; display: block; }
    .row-qty small { color: var(--muted); }
    .row-qty.zero b { color: var(--bad); }
    .thumb {
      width: 44px; height: 44px; border-radius: 12px; flex: none; display: grid; place-items: center; font-weight: 700; font-size: 18px;
      background: hsl(var(--hue) 45% 88%); color: hsl(var(--hue) 40% 30%); background-size: cover; background-position: center;
    }
    @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .thumb { background-color: hsl(var(--hue) 25% 25%); color: hsl(var(--hue) 50% 80%); } }
    :root[data-theme="dark"] .thumb { background-color: hsl(var(--hue) 25% 25%); color: hsl(var(--hue) 50% 80%); }
    .badges { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
    .badge { font-size: 11px; font-weight: 600; padding: 2px 7px; border-radius: 6px; background: var(--line); color: var(--muted); }
    .badge.warn { background: var(--warn-soft); color: var(--warn); }
    .badge.bad { background: var(--bad-soft); color: var(--bad); }
    .badge.low { background: var(--low-soft); color: var(--low); }
    .badge.ok { background: var(--accent-soft); color: var(--accent); }

    .empty { text-align: center; color: var(--muted); padding: 48px 16px; }
    .empty .ic { width: 48px; height: 48px; opacity: .5; margin-bottom: 8px; }
    .section-h { display: flex; align-items: baseline; justify-content: space-between; margin: 18px 2px 4px; }
    .section-h h3 { margin: 0; font-size: 15px; }
    .section-h small { color: var(--muted); }

    /* Lista de la compra */
    .item { gap: 10px; }
    .check { width: 28px; height: 28px; border-radius: 50%; border: 2px solid var(--accent); background: none; flex: none; padding: 0; display: grid; place-items: center; }
    .item.done { opacity: .55; box-shadow: none; }
    .item.done .check { background: var(--accent); color: var(--accent-ink); }
    .item.done .row-title { text-decoration: line-through; }
    .add-form { display: flex; gap: 8px; margin-top: 12px; }
    .add-form input { flex: 1; min-width: 0; }
    .linkbtn { border: 0; background: none; color: var(--accent); font-weight: 600; padding: 8px 2px; }

    /* Formularios */
    .inp, select.inp, textarea.inp { width: 100%; height: 46px; border: 1px solid var(--line); border-radius: 10px; background: var(--card); padding: 0 12px; outline: 0; }
    textarea.inp { height: 90px; padding: 10px 12px; resize: vertical; }
    .inp:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
    .field { display: grid; gap: 4px; margin-bottom: 12px; align-content: start; }
    .lbl { font-size: 13px; font-weight: 600; color: var(--muted); }
    .hint { color: var(--muted); font-size: 12px; }
    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .grid3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
    .toggle { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); }
    .toggle span:first-child { flex: 1; }
    .toggle small { display: block; color: var(--muted); font-size: 12px; }
    .toggle input { position: absolute; opacity: 0; pointer-events: none; }
    .sw { width: 46px; height: 28px; border-radius: 14px; background: var(--line); position: relative; flex: none; transition: background .15s; }
    .sw::after { content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.25); transition: transform .15s; }
    .toggle input:checked + .sw { background: var(--accent); }
    .toggle input:checked + .sw::after { transform: translateX(18px); }
    fieldset { border: 0; padding: 0; margin: 18px 0 6px; }
    legend { font-weight: 700; font-size: 15px; margin-bottom: 8px; padding: 0; }

    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 46px; padding: 0 16px; border-radius: 12px;
      border: 1px solid var(--line); background: var(--card); font-weight: 600;
    }
    .btn:disabled { opacity: .45; }
    .btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
    .btn.danger { color: var(--bad); }
    .btn.block { width: 100%; margin-top: 10px; }
    .btn.small { height: 36px; padding: 0 12px; font-size: 14px; border-radius: 10px; }
    .actions { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 12px 0; }
    .actions .btn { padding: 0 8px; }

    /* Hojas inferiores */
    .backdrop { position: fixed; inset: 0; z-index: 50; background: rgba(20,15,5,0); display: flex; align-items: flex-end; justify-content: center; transition: background .2s; }
    .backdrop.open { background: rgba(20,15,5,.42); }
    .sheet {
      width: 100%; max-width: 640px; max-height: 92dvh; display: flex; flex-direction: column; background: var(--bg);
      border-radius: 20px 20px 0 0; transform: translateY(100%); transition: transform .22s ease-out;
    }
    .backdrop.open .sheet { transform: none; }
    .sheet-head { display: flex; align-items: center; gap: 8px; padding: 14px 10px 6px 18px; }
    .sheet-head h2 { margin: 0; font-size: 19px; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .sheet-body { overflow-y: auto; padding: 4px 18px calc(22px + env(safe-area-inset-bottom)); -webkit-overflow-scrolling: touch; }
    .sheet h3 { font-size: 15px; margin: 18px 0 8px; }
    .hero { width: 100%; max-height: 220px; object-fit: cover; border-radius: var(--r); display: block; margin-bottom: 10px; background: var(--line); }
    .meta-line { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; color: var(--muted); font-size: 14px; }
    .stock { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-top: 10px; }
    .stock .big { font-size: 34px; }
    .muted { color: var(--muted); font-size: 14px; }
    .notes { white-space: pre-wrap; background: var(--card); border-radius: 10px; padding: 10px 12px; border: 1px solid var(--line); margin: 0; }
    .lot { display: flex; align-items: center; gap: 10px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 8px 10px; margin-bottom: 6px; }
    .lot .row-main { font-size: 14px; }
    .stepper { display: flex; align-items: center; gap: 4px; }
    .stepper b { min-width: 46px; text-align: center; }
    .stepper button { width: 34px; height: 34px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); display: grid; place-items: center; padding: 0; }
    .var-row { display: grid; grid-template-columns: 1fr 1.2fr auto auto; gap: 6px; align-items: center; margin-bottom: 8px; }
    .var-row .inp { height: 42px; padding: 0 10px; }
    .fav { width: 38px; height: 42px; border: 1px solid var(--line); border-radius: 10px; background: var(--card); color: var(--muted); padding: 0; font-size: 18px; }
    .fav.on { color: #e0a100; border-color: #e0a100; }
    .codebox { display: flex; gap: 4px; }
    .codebox .inp { min-width: 0; }
    .codebox button { flex: none; width: 42px; height: 42px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); display: grid; place-items: center; padding: 0; }
    .photo-box { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
    .photo-box .thumb { width: 72px; height: 72px; border-radius: 14px; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 4px 14px 12px; margin-bottom: 14px; }
    .card h3 { margin: 12px 0 4px; font-size: 16px; }
    .card p { margin: 6px 0; }
    .note-box { background: var(--warn-soft); color: var(--warn); border-radius: 10px; padding: 10px 12px; font-size: 14px; margin: 8px 0; }
    .err { color: var(--bad); font-size: 13px; word-break: break-word; }
    .btn-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
    .pick-row { margin-bottom: 6px; }

    /* Avisos breves */
    #toasts { position: fixed; left: 12px; right: 12px; bottom: calc(var(--tab-h) + 14px + env(safe-area-inset-bottom)); z-index: 80; display: grid; gap: 8px; justify-items: center; pointer-events: none; }
    .toast { pointer-events: auto; display: flex; align-items: center; gap: 14px; background: var(--ink); color: var(--bg); border-radius: 12px; padding: 11px 14px; font-size: 14px; box-shadow: var(--shadow); max-width: 520px; animation: up .2s ease-out; }
    .toast button { border: 0; background: none; color: var(--accent); font-weight: 700; filter: brightness(1.4); padding: 0; }
    @keyframes up { from { transform: translateY(12px); opacity: 0; } }

    /* Ubicaciones, existencias por sitio y herramientas */
    select.chip { max-width: 62vw; text-overflow: ellipsis; }
    .loc-group { display: flex; align-items: center; gap: 6px; margin: 12px 2px 6px; font-size: 13px; font-weight: 700; color: var(--muted); }
    .loc-group .ic { width: 16px; height: 16px; }
    .stepper button.mv { margin-left: 4px; color: var(--muted); }
    .stepper button .ic { width: 18px; height: 18px; }
    .split { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 14px; color: var(--muted); font-size: 14px; margin-top: 4px; }
    .split .linkbtn { padding: 4px 0; }
    .tree-row { display: flex; align-items: center; gap: 8px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 6px 6px 6px 12px; margin-bottom: 6px; min-height: 54px; }
    .tree-row.d1 { margin-left: 20px; }
    .tree-row.d2 { margin-left: 40px; }
    .toolbar { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0 2px; }
    .toolbar .ic { width: 18px; height: 18px; }
    .btn-row .ic { width: 18px; height: 18px; }
    .note-box .linkbtn { color: inherit; text-decoration: underline; padding: 0; }
    a.btn { text-decoration: none; color: inherit; }
    a.btn.primary { color: var(--accent-ink); }

    /* Etiquetas y tiendas */
    .thumb.emoji { font-size: 24px; font-weight: 400; }
    .row-title .syms { margin-left: 6px; font-weight: 400; font-size: 14px; }
    .sym { width: 44px; height: 44px; border-radius: 12px; background: var(--bg); display: grid; place-items: center; font-size: 24px; flex: none; }
    .sym.big { width: 72px; height: 72px; font-size: 40px; margin: 0 auto 8px; }
    .sym-row { display: grid; grid-template-columns: 84px 1fr; gap: 10px; }
    .sym-input { text-align: center; font-size: 24px; }
    .palette { display: flex; flex-wrap: wrap; gap: 6px; margin: 2px 0 6px; }
    .pal { width: 40px; height: 40px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); font-size: 20px; padding: 0; }
    .chips.wrap { flex-wrap: wrap; overflow: visible; margin: 0; padding: 4px 0; }
    .chip.add { border-style: dashed; color: var(--muted); }
    .meta-line .badge { font-size: 12px; }

    /* Recetas */
    .recipe { border-left: 6px solid var(--line); }
    .recipe.ok { border-left-color: var(--accent); background: color-mix(in srgb, var(--accent-soft) 45%, var(--card)); }
    .recipe.warn { border-left-color: var(--warn); background: color-mix(in srgb, var(--warn-soft) 45%, var(--card)); }
    .recipe.bad { border-left-color: var(--bad); background: color-mix(in srgb, var(--bad-soft) 35%, var(--card)); }
    .recipe.mid { border-left-color: var(--mid-dot); background: color-mix(in srgb, var(--mid-soft) 55%, var(--card)); }
    .dot { width: 12px; height: 12px; border-radius: 50%; flex: none; background: var(--line); }
    .dot.ok { background: var(--accent); } .dot.warn { background: var(--warn); } .dot.bad { background: var(--bad); }
    .thumb.big { width: 72px; height: 72px; border-radius: 14px; }
    .status-box { border-radius: 12px; padding: 10px 12px; font-weight: 600; margin: 4px 0 10px; }
    .status-box.ok { background: var(--accent-soft); color: var(--accent); }
    .status-box.warn { background: var(--warn-soft); color: var(--warn); }
    .status-box.bad { background: var(--bad-soft); color: var(--bad); }
    .ing-list { display: grid; grid-template-columns: minmax(0, 1fr); gap: 6px; }
    .ing { display: flex; align-items: center; gap: 10px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 8px 12px; }
    .ing-mark { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; font-size: 14px; flex: none; }
    .ing-mark.ok { background: var(--accent-soft); color: var(--accent); }
    .ing-mark.bad { background: var(--bad-soft); color: var(--bad); }
    .ing-mark.basic { background: var(--line); color: var(--muted); }
    .ing-qty { color: var(--muted); font-size: 14px; text-align: right; white-space: nowrap; }
    .actions.two { grid-template-columns: 1fr 1fr; }
    .steps { padding-left: 22px; margin: 0; display: grid; gap: 8px; }
    .steps li { padding-left: 4px; }
    textarea.inp.tall { height: 160px; }
    .ing-edit { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 8px; margin-bottom: 8px; }
    .ing-row { display: grid; grid-template-columns: 1fr auto; gap: 6px; align-items: center; }
    .ing-row2 { display: grid; grid-template-columns: 96px 1fr; gap: 6px; margin-top: 6px; }
    .ing-row .inp, .ing-row2 .inp { height: 42px; padding: 0 10px; }
    .ing-opts { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
    .mini-chip { border: 1px solid var(--line); background: var(--bg); border-radius: 999px; padding: 4px 10px; font-size: 13px; color: var(--muted); }
    .mini-chip.on { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); }
    .seg { display: grid; grid-template-columns: 1fr 1fr; background: var(--line); border-radius: 12px; padding: 3px; gap: 3px; margin-bottom: 8px; }
    .seg button { border: 0; border-radius: 10px; height: 38px; background: none; font-weight: 600; color: var(--muted); }
    .seg button.on { background: var(--card); color: var(--ink); box-shadow: var(--shadow); }
    .row.pick { cursor: pointer; }
    .row.pick input[type=checkbox] { width: 22px; height: 22px; accent-color: var(--accent); flex: none; }
    .row.sel { border-color: var(--accent); }
    .qty-in { display: flex; align-items: center; gap: 4px; }
    .qty-in .inp { width: 72px; height: 40px; text-align: right; }
    .opt-row { display: flex; gap: 6px; align-items: center; margin-bottom: 6px; }
    .or { text-align: center; color: var(--muted); margin: 10px 0; }
    .note-box.ok { background: var(--accent-soft); color: var(--accent); }

    /* Ajustes */
    .set-h { display: flex; align-items: baseline; justify-content: space-between; margin: 18px 2px 2px; }
    .set-h:first-child { margin-top: 4px; }
    .set-h h3 { margin: 0; font-size: 15px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
    .set-row .sym { width: 40px; height: 40px; font-size: 20px; }
    .chev { color: var(--muted); font-size: 24px; line-height: 1; padding: 0 4px; }
    .sub-h { margin: 18px 0 2px; font-size: 14px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
    .preview.tall { max-height: 260px; overflow: auto; }
    .preview { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; margin: 4px 0 0; font: 14px/1.5 ui-monospace, Menlo, Consolas, monospace; white-space: pre-wrap; }

    /* Categorías y base de productos */
    .row.child { margin-left: 22px; width: calc(100% - 22px); }
    .cat-main { display: flex; align-items: center; gap: 12px; flex: 1; min-width: 0; }
    .tag-group { width: 100%; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 8px; }
    .tag-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
    .tag-head .linkbtn { font-size: 13px; padding: 4px 2px; }
    .chip.parent { font-weight: 700; }
    .search-btn { border: 0; background: var(--accent-soft); color: var(--accent); font-weight: 700; border-radius: 9px; padding: 7px 10px; font-size: 13px; white-space: nowrap; }
    .db-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 8px; }
    .db-item { position: relative; display: grid; justify-items: center; gap: 4px; padding: 10px 6px; border-radius: 12px; border: 1px solid var(--line); background: var(--card); text-align: center; }
    .db-item.on { border-color: var(--accent); background: var(--accent-soft); box-shadow: 0 0 0 2px var(--accent) inset; }
    .db-item.have { opacity: .55; }
    .db-sym { font-size: 28px; line-height: 1; }
    .db-name { font-size: 13px; line-height: 1.2; }
    .db-have { font-size: 11px; color: var(--accent); }
    .sticky-bottom { position: sticky; bottom: 0; margin-top: 14px; box-shadow: 0 -6px 16px var(--bg); }

    /* Apuntar en la lista */
    .qa { position: sticky; top: calc(62px + env(safe-area-inset-top)); z-index: 15; background: var(--bg); padding: 4px 0 6px; margin: -4px 0 4px; }
    .qa-box { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
    .qa-box .ic { color: var(--accent); }
    .qa-box input::-webkit-search-cancel-button { -webkit-appearance: none; appearance: none; display: none; }
    .qa-sugg { display: grid; gap: 4px; margin-top: 6px; }
    .qa-sugg:empty { display: none; }
    .qa-item { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; border: 1px solid var(--line); background: var(--card); border-radius: 12px; padding: 8px 10px; min-height: 52px; }
    .qa-item:first-child { border-color: var(--accent); }
    .qa-sym { font-size: 24px; width: 32px; text-align: center; flex: none; }
    .qa-name { display: block; font-weight: 600; }
    .qa-sub { display: block; color: var(--muted); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .qa-plus { font-size: 26px; font-weight: 300; color: var(--accent); width: 28px; text-align: center; flex: none; }
    .isym { margin-right: 6px; }
    .cat-h { font-size: 13px; font-weight: 700; color: var(--muted); margin: 8px 2px 0; }
    .cat-h:first-child { margin-top: 0; }

    /* v1.7 · Lista: notas, cantidades, carro y sugerencias */
    .row-note { font-size: 13px; color: var(--ink); opacity: .8; font-style: italic; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .row-main.plain { border: 0; background: none; padding: 0; text-align: left; color: inherit; font: inherit; }
    .mini-step { display: flex; align-items: center; gap: 2px; flex: none; }
    .mini-step button { width: 30px; height: 30px; border-radius: 9px; border: 1px solid var(--line); background: var(--bg); font-size: 18px; line-height: 1; padding: 0; color: var(--ink); }
    .mini-step b { min-width: 30px; text-align: center; font-size: 14px; white-space: nowrap; }
    .sugg { margin: 4px 0 2px; }
    .sugg .chips { padding-top: 6px; }
    .sugg-chip.due { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); font-weight: 600; }
    .cart-banner { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; }
    .small-link { padding: 0 0 0 6px; font-size: 12px; }
    .aisle-n { width: 26px; height: 26px; border-radius: 50%; background: var(--line); color: var(--muted); display: grid; place-items: center; font-size: 13px; font-weight: 700; flex: none; }
    .row.aisle { padding-top: 6px; padding-bottom: 6px; gap: 6px; }
    .finished-btn { color: var(--bad); }
    .hero.contain { object-fit: contain; background: #fff; }
    .off-card { display: flex; gap: 12px; align-items: center; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 10px; margin: 8px 0; }
    .off-card img { width: 64px; height: 64px; object-fit: contain; border-radius: 8px; background: #fff; flex: none; }
    .off-card .muted { font-size: 13px; }

    /* Guardar la compra */
    .stock-in { padding-top: 10px; }
    .si-head { display: grid; gap: 2px; margin-bottom: 2px; }
    .grid2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 8px; }
    .grid2 > * { min-width: 0; }
    .grid2 .inp { min-width: 0; max-width: 100%; }

    /* Modo súper */
    body.super-open { overflow: hidden; }
    .super { position: fixed; inset: 0; z-index: 45; background: var(--bg); overflow-y: auto; -webkit-overflow-scrolling: touch; }
    .super-body { max-width: 640px; margin: 0 auto; padding: 0 14px calc(40px + env(safe-area-inset-bottom)); }
    .super-top { position: sticky; top: 0; z-index: 2; background: var(--bg); display: flex; align-items: center; gap: 10px; padding: calc(12px + env(safe-area-inset-top)) 0 8px; }
    .super-title { flex: 1; min-width: 0; display: grid; }
    .super-title b { font-size: 20px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .super-title small { color: var(--muted); font-size: 14px; }
    .progress { height: 8px; border-radius: 4px; background: var(--line); overflow: hidden; margin: 2px 0 4px; }
    .progress span { display: block; height: 100%; background: var(--accent); border-radius: 4px; transition: width .3s; }
    .super .qa { position: static; margin: 6px 0 4px; }
    .slist { display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px; margin-top: 6px; }
    .srow { display: flex; align-items: stretch; gap: 6px; min-width: 0; }
    .srow-main { flex: 1; min-width: 0; display: flex; align-items: center; gap: 12px; text-align: left; background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 10px 12px; min-height: 60px; color: var(--ink); box-shadow: var(--shadow); }
    .srow-main:active { background: var(--accent-soft); }
    .scheck { width: 30px; height: 30px; border-radius: 50%; border: 2px solid var(--accent); display: grid; place-items: center; flex: none; font-weight: 800; color: var(--accent-ink); }
    .srow.done .scheck { background: var(--accent); }
    .srow.done .srow-main { opacity: .55; box-shadow: none; }
    .srow.done .sname { text-decoration: line-through; }
    .ssym { font-size: 24px; width: 30px; text-align: center; flex: none; }
    .ssym:empty { display: none; }
    .sname { flex: 1; min-width: 0; font-weight: 600; font-size: 17px; overflow-wrap: anywhere; }
    .sname small { display: block; font-weight: 400; font-size: 13px; color: var(--muted); font-style: italic; }
    .sqty { color: var(--muted); font-size: 15px; white-space: nowrap; flex: none; }
    .sstep { display: grid; grid-template-rows: 1fr 1fr; gap: 4px; flex: none; }
    .sstep button { width: 40px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); font-size: 20px; line-height: 1; padding: 0; color: var(--ink); }
    .super.big .srow-main { min-height: 72px; }
    .super.big .sname { font-size: 21px; }
    .super.big .sqty { font-size: 18px; }
    .super.big .ssym { font-size: 30px; width: 36px; }
    .super.big .scheck { width: 36px; height: 36px; }
    .super .cat-h { font-size: 14px; margin-top: 10px; }

    /* v1.8 · Ubicaciones con color: estancia fuerte, mueble medio, estante clarito */
    .loc-chip { --lh: 215; --ls: 15%; display: inline-block; vertical-align: middle; max-width: 100%; min-width: 0; border-radius: 7px; padding: 2px 8px; font-size: 13px; line-height: 1.35;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: none; }
    .loc-chip.d0 { background: hsl(var(--lh) var(--ls) 32%); color: #fff; font-weight: 700; }
    .loc-chip.d1 { background: hsl(var(--lh) var(--ls) 70%); color: hsl(var(--lh) var(--ls) 15%); font-weight: 600; }
    .loc-chip.d2 { background: hsl(var(--lh) var(--ls) 90%); color: hsl(var(--lh) var(--ls) 24%); font-weight: 500; }
    .loc-chip.none { background: var(--line); color: var(--muted); font-weight: 500; }
    .loc-chip.sm { font-size: 12px; padding: 1px 6px; border-radius: 6px; }
    .loc-crumb { display: inline-flex; align-items: center; gap: 3px; min-width: 0; max-width: 100%; overflow: hidden; vertical-align: middle; }
    .loc-crumb .loc-chip { flex: 0 1 auto; }
    .loc-crumb.sm .loc-chip { max-width: 9.5em; }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) .loc-chip.d0 { background: hsl(var(--lh) var(--ls) 40%); }
      :root:not([data-theme="light"]) .loc-chip.d1 { background: hsl(var(--lh) var(--ls) 27%); color: hsl(var(--lh) var(--ls) 88%); }
      :root:not([data-theme="light"]) .loc-chip.d2 { background: hsl(var(--lh) calc(var(--ls) * .7) 18%); color: hsl(var(--lh) var(--ls) 80%); }
    }
    :root[data-theme="dark"] .loc-chip.d0 { background: hsl(var(--lh) var(--ls) 40%); }
    :root[data-theme="dark"] .loc-chip.d1 { background: hsl(var(--lh) var(--ls) 27%); color: hsl(var(--lh) var(--ls) 88%); }
    :root[data-theme="dark"] .loc-chip.d2 { background: hsl(var(--lh) calc(var(--ls) * .7) 18%); color: hsl(var(--lh) var(--ls) 80%); }
    .row-locs { display: flex; align-items: center; gap: 6px; overflow: hidden; white-space: nowrap; margin-top: 2px; }
    .row-locs small { color: var(--muted); flex: none; }
    .meta-loc { display: inline-flex; align-items: center; gap: 4px; min-width: 0; max-width: 100%; }
    .loc-group { flex-wrap: wrap; }
    .chip.loc-filter { display: inline-flex; align-items: center; gap: 4px; }
    .chip.loc-filter.on { background: var(--card); color: var(--ink); border-color: var(--ink); }

    /* Selector en árbol */
    .loc-pick { display: flex; align-items: center; gap: 8px; text-align: left; color: var(--ink); cursor: pointer; overflow: hidden; }
    .loc-pick .loc-crumb { flex: 1; }
    .loc-pick .lp-arrow { margin-left: auto; color: var(--muted); flex: none; }
    .lp-tree { display: grid; grid-template-columns: minmax(0, 1fr); gap: 4px; margin: 6px 0 4px; }
    .lp-row { display: flex; align-items: center; gap: 4px; padding-left: calc(var(--ind, 0) * 22px); min-width: 0; }
    .lp-row.lp-plain { width: 100%; border: 1px solid var(--line); background: var(--card); border-radius: 12px; min-height: 48px; padding: 6px 12px; text-align: left; margin-bottom: 4px; color: var(--ink); font-weight: 600; }
    .lp-row.lp-plain.sel { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
    .lp-caret { width: 34px; height: 44px; border: 0; background: none; color: var(--muted); font-size: 16px; flex: none; padding: 0; display: grid; place-items: center; }
    .lp-caret.empty { visibility: hidden; }
    .lp-main { flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px; border: 1px solid var(--line); background: var(--card); border-radius: 12px; min-height: 46px; padding: 6px 10px; text-align: left; color: var(--ink); }
    .lp-main small { color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
    .lp-main .loc-chip { font-size: 15px; padding: 4px 10px; }
    .lp-row.sel .lp-main { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
    .lp-row.off .lp-main { opacity: .4; }
    .lp-check { margin-left: auto; color: var(--accent); font-weight: 800; flex: none; }
    .lp-row .icon-btn { flex: none; }

    /* Colores */
    .swatches { display: grid; gap: 8px; margin-bottom: 6px; }
    .sw-row { display: grid; gap: 4px; }
    .sw-row small { color: var(--muted); font-size: 12px; }
    .sw-list { display: flex; flex-wrap: wrap; gap: 7px; }
    .swatch { --lh: 0; --ls: 0%; width: 34px; height: 34px; border-radius: 50%; border: 2px solid transparent; padding: 0; flex: none;
      background: linear-gradient(135deg, hsl(var(--lh) var(--ls) 32%) 0 40%, hsl(var(--lh) var(--ls) 70%) 40% 70%, hsl(var(--lh) var(--ls) 90%) 70%); }
    .swatch.on { border-color: var(--ink); box-shadow: 0 0 0 2px var(--bg) inset; }
    .swatch.auto { width: auto; border-radius: 999px; padding: 0 14px; background: var(--card); border: 1px solid var(--line); font-weight: 600; justify-self: start; height: 36px; color: var(--ink); }
    .swatch.auto.on { border: 2px solid var(--ink); }

    /* Inventario «Por sitios» */
    .inv-seg { margin: 10px 0 0; }
    .inv-node { --lh: 215; --ls: 15%; border-radius: 14px; min-width: 0; }
    .inv-node + .inv-node { margin-top: 8px; }
    .inv-kids { display: grid; grid-template-columns: minmax(0, 1fr); gap: 6px; padding: 6px 0 2px 10px; margin-left: 8px; border-left: 3px solid hsl(var(--lh) var(--ls) 70%); }
    .inv-kids .inv-node + .inv-node, .inv-kids > .inv-node { margin-top: 0; }
    .inv-loc { display: flex; align-items: center; gap: 6px; width: 100%; min-height: 48px; border: 0; border-radius: 12px; padding: 6px 12px 6px 4px; text-align: left; font-size: 16px; }
    .inv-node.d0 > .inv-loc { background: hsl(var(--lh) var(--ls) 32%); color: #fff; font-weight: 800; font-size: 17px; }
    .inv-node.d1 > .inv-loc { background: hsl(var(--lh) var(--ls) 70%); color: hsl(var(--lh) var(--ls) 14%); font-weight: 700; }
    .inv-node.d2 > .inv-loc { background: hsl(var(--lh) var(--ls) 90%); color: hsl(var(--lh) var(--ls) 22%); font-weight: 600; }
    .inv-node.none > .inv-loc { background: var(--line); color: var(--muted); font-weight: 700; }
    .inv-node.none > .inv-kids { border-left-color: var(--line); }
    .inv-loc .lp-caret { height: 32px; width: 28px; color: inherit; opacity: .8; display: grid; place-items: center; }
    .inv-loc-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .inv-res { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; opacity: .85; }
    .inv-count { min-width: 26px; height: 24px; border-radius: 12px; padding: 0 8px; display: grid; place-items: center; font-size: 13px; font-weight: 700; background: rgba(255,255,255,.28); }
    .inv-node.d1 > .inv-loc .inv-count, .inv-node.d2 > .inv-loc .inv-count { background: rgba(255,255,255,.55); }
    .inv-item { padding-top: 6px; padding-bottom: 6px; min-height: 0; }
    .thumb.sm { width: 34px; height: 34px; border-radius: 9px; font-size: 15px; }
    .thumb.sm.emoji { font-size: 19px; }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) .inv-node.d0 > .inv-loc { background: hsl(var(--lh) var(--ls) 36%); }
      :root:not([data-theme="light"]) .inv-node.d1 > .inv-loc { background: hsl(var(--lh) var(--ls) 25%); color: hsl(var(--lh) var(--ls) 90%); }
      :root:not([data-theme="light"]) .inv-node.d2 > .inv-loc { background: hsl(var(--lh) calc(var(--ls) * .7) 17%); color: hsl(var(--lh) var(--ls) 82%); }
      :root:not([data-theme="light"]) .inv-kids { border-left-color: hsl(var(--lh) var(--ls) 30%); }
      :root:not([data-theme="light"]) .inv-loc .inv-count { background: rgba(0,0,0,.25); }
    }
    :root[data-theme="dark"] .inv-node.d0 > .inv-loc { background: hsl(var(--lh) var(--ls) 36%); }
    :root[data-theme="dark"] .inv-node.d1 > .inv-loc { background: hsl(var(--lh) var(--ls) 25%); color: hsl(var(--lh) var(--ls) 90%); }
    :root[data-theme="dark"] .inv-node.d2 > .inv-loc { background: hsl(var(--lh) calc(var(--ls) * .7) 17%); color: hsl(var(--lh) var(--ls) 82%); }
    :root[data-theme="dark"] .inv-kids { border-left-color: hsl(var(--lh) var(--ls) 30%); }
    :root[data-theme="dark"] .inv-loc .inv-count { background: rgba(0,0,0,.25); }
    .row.just { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }

    /* Guardar la compra */
    .stock-in.off > *:not(.si-head):not(.toggle) { opacity: .4; }
    .stock-in.off .si-head b { text-decoration: line-through; color: var(--muted); }

    /* Menú semanal */
    .top-seg { margin: 0 0 10px; }
    .week-nav { display: flex; align-items: center; gap: 6px; }
    .week-nav .icon-btn { font-size: 26px; line-height: 1; }
    .week-title { flex: 1; display: grid; justify-items: center; text-align: center; }
    .week-title b { font-size: 17px; }
    .week-title small { color: var(--muted); font-size: 13px; }
    .week-title .linkbtn { padding: 0; font-size: 13px; }
    .week { display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; margin-top: 10px; }
    .day { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 8px 10px 10px; min-width: 0; }
    .day.today { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
    .day.past { opacity: .6; }
    .day-h { display: flex; align-items: center; gap: 8px; margin: 0 2px 6px; min-height: 30px; }
    .day-h small { margin-left: auto; }
    .day-cart { width: 34px; height: 34px; margin: -4px -6px -4px 0; color: var(--accent); }
    .day-cart .ic { width: 20px; height: 20px; }
    .day-h small { color: var(--muted); }
    .meal { display: flex; align-items: flex-start; gap: 10px; width: 100%; min-width: 0; text-align: left; border: 0; border-top: 1px solid var(--line); background: none; padding: 9px 2px; color: var(--ink); }
    .meal:first-of-type { border-top: 0; }
    .meal-slot { width: 74px; flex: none; font-size: 13px; color: var(--muted); font-weight: 600; }
    .meal-main { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: stretch; gap: 4px; }
    .dish-line { display: grid; grid-template-columns: 12px minmax(0, 1fr); gap: 8px; align-items: baseline; min-width: 0; }
    .dish-line .dot, .dish-line .meal-done { width: 10px; height: 10px; align-self: center; }
    .dish-txt small { color: var(--muted); font-size: 12px; margin-left: 6px; white-space: nowrap; }
    .meal-main small { color: var(--muted); font-size: 12px; }
    .meal-name { font-weight: 600; overflow-wrap: anywhere; }
    .meal-add { color: var(--accent); font-size: 14px; }
    .meal-done { width: 18px; height: 18px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font-size: 11px; font-weight: 800; flex: none; }
    .chosen { display: flex; align-items: center; justify-content: space-between; gap: 8px; background: var(--accent-soft); color: var(--accent); border-radius: 10px; padding: 6px 12px; margin-bottom: 8px; }
    .chosen b { overflow-wrap: anywhere; }
    .rec-pick { max-height: 38vh; overflow-y: auto; margin: 8px 0; }
    .rec-pick .row { padding-top: 8px; padding-bottom: 8px; }
    .rec-pick .row.sel { border-color: var(--accent); background: var(--accent-soft); }
    .menu-pick { display: grid; gap: 8px; }
    .mp-day { display: grid; gap: 4px; }
    .mp-slots { display: flex; flex-wrap: wrap; gap: 6px; }
    .chip.busy { color: var(--muted); }
    @media (min-width: 560px) { .week { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); } }

    /* Varios platos por comida */
    .dishes { display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px; }
    .card.dish { padding: 8px 10px 10px; margin: 0; }
    .card.dish.cooked { opacity: .7; }
    .dish-top { display: flex; align-items: center; gap: 8px; min-width: 0; }
    .dish-name { flex: 1; min-width: 0; overflow-wrap: anywhere; }
    select.chip.course-sel { flex: none; font-size: 13px; padding-top: 5px; padding-bottom: 5px; }
    .dish-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: 8px; }
    .dish-actions .stepper b { min-width: 46px; font-size: 14px; }
    .btn.small.sq { width: 40px; padding: 0; flex: none; }
    .dish-actions .stepper button { width: 32px; height: 34px; }
    .dish-actions .ic { width: 16px; height: 16px; }
    .course-pick { margin: 0 0 8px; }
    .rec-pick .qa-plus { font-size: 24px; }

    /* Favoritas */
    .fav-row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin: 0 0 10px; }
    .fav-row .lbl { margin-right: 2px; }
    .chip.heart.on { background: var(--bad-soft); color: var(--bad); border-color: var(--bad); }
    .badge.heart { background: var(--bad-soft); color: var(--bad); }
    .rec-h { margin: 14px 2px 2px; font-size: 14px; }
    .rec-h:first-child { margin-top: 4px; }
    .rec-h small { font-weight: 600; opacity: .7; }

    /* v1.9 · Recetas: amarillo, datos, nutrición y salud */
    .dot.mid { background: var(--mid-dot); }
    .status-box.mid { background: var(--mid-soft); color: var(--mid); }
    .ing-mark.mid { background: var(--mid-soft); color: var(--mid); }
    .badge.mid { background: var(--mid-soft); color: var(--mid); }
    .ing-h { font-size: 13px; font-weight: 700; color: var(--muted); margin: 10px 2px 6px; }
    .ing-h small { font-weight: 500; }
    .facts { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
    .fact { font-size: 12px; font-weight: 600; color: var(--muted); background: var(--bg); border-radius: 6px; padding: 1px 6px; }
    .fact.hs.ok { color: var(--accent); background: var(--accent-soft); }
    .fact.hs.mid { color: var(--mid); background: var(--mid-soft); }
    .fact.hs.bad { color: var(--bad); background: var(--bad-soft); }
    .chip.on-soft { background: var(--mid-soft); color: var(--mid); border-color: var(--mid-dot); font-weight: 700; }
    .rate-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; }
    .rate-btn { height: 48px; border-radius: 12px; border: 1px solid var(--line); background: var(--card); font-size: 18px; font-weight: 700; color: var(--ink); }
    .rate-btn.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
    .keep { display: grid; grid-template-columns: minmax(0, 1fr); gap: 6px; margin: 12px 0 4px; }
    .keep-row > div { min-width: 0; }
    .keep-row .row-sub { white-space: normal; }
    .keep-row { min-width: 0; display: flex; align-items: center; gap: 10px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 8px 12px; }
    .keep-row .sym { font-size: 22px; width: 28px; text-align: center; flex: none; }
    .tips { margin: 0; padding-left: 20px; display: grid; gap: 6px; }
    .nut-grid { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; }
    .nut { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 8px 4px; text-align: center; display: grid; gap: 1px; min-width: 0; }
    .nut b { font-size: 18px; }
    .nut small { color: var(--muted); font-size: 11px; }
    .nut span { font-size: 11px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .hs-box { display: flex; align-items: center; gap: 12px; width: 100%; margin-top: 10px; border: 0; border-radius: 14px; padding: 10px 14px; text-align: left; color: var(--ink); background: var(--line); }
    .hs-box.ok { background: var(--accent-soft); color: var(--accent); }
    .hs-box.mid { background: var(--mid-soft); color: var(--mid); }
    .hs-box.bad { background: var(--bad-soft); color: var(--bad); }
    .hs-num { font-size: 30px; font-weight: 800; min-width: 52px; text-align: center; }
    .hs-box.big .hs-num { font-size: 40px; }
    .hs-box small { opacity: .8; }
    .hs-details { display: grid; gap: 10px; margin-top: 10px; }
    .hs-part-h, .crit-h { display: flex; justify-content: space-between; gap: 8px; font-size: 14px; }
    .hs-part-h .neg { color: var(--bad); }
    .bar { height: 7px; border-radius: 4px; background: var(--line); overflow: hidden; margin: 4px 0 2px; }
    .bar span { display: block; height: 100%; background: var(--accent); border-radius: 4px; }
    .crit { margin-bottom: 10px; }
    .crit.mid .bar span { background: var(--mid-dot); }
    .crit.bad .bar span { background: var(--bad); }
    .day-score { border: 0; border-radius: 999px; padding: 2px 9px; font-size: 13px; font-weight: 800; background: var(--line); color: var(--muted); }
    .day-score.ok { background: var(--accent-soft); color: var(--accent); }
    .day-score.mid { background: var(--mid-soft); color: var(--mid); }
    .day-score.bad { background: var(--bad-soft); color: var(--bad); }
    .week-score { display: flex; align-items: center; gap: 12px; width: 100%; border: 0; border-radius: 14px; padding: 10px 14px; margin-top: 10px; text-align: left; background: var(--line); color: var(--ink); }
    .week-score.ok { background: var(--accent-soft); color: var(--accent); }
    .week-score.mid { background: var(--mid-soft); color: var(--mid); }
    .week-score.bad { background: var(--bad-soft); color: var(--bad); }
    .ws-main { display: grid; min-width: 0; }
    .ws-main small { opacity: .85; font-size: 12px; }

    /* Escáner */
    .scanner { position: fixed; inset: 0; z-index: 90; background: #000; color: #fff; display: flex; flex-direction: column; }
    .scanner-top { display: flex; align-items: center; justify-content: space-between; padding: calc(10px + env(safe-area-inset-top)) 12px 10px 18px; font-weight: 600; }
    #reader { flex: 1; width: 100%; overflow: hidden; display: flex; align-items: center; }
    #reader video { width: 100% !important; height: auto !important; }
    .scanner-msg { margin: 16px; padding: 12px; border-radius: 10px; background: #3a1d1a; color: #ffd2cb; font-size: 14px; }
    .scanner-manual { display: flex; gap: 8px; padding: 12px 16px calc(16px + env(safe-area-inset-bottom)); }
    .scanner-manual input { flex: 1; min-width: 0; height: 46px; border-radius: 12px; border: 0; padding: 0 12px; color: #111; }
  </style>
</head>

  <header class="top">
    <h1 id="title">Inventario</h1>

  <main id="main"></main>
